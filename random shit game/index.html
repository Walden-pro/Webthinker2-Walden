<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smash Arena</title>
    <!-- Include p5.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
        }
        .instructions {
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="game-links" style="margin: 0 0 12px;"><a href="../index.html">Home</a></div>
    <h1>Smash Arena</h1>
    <div class="instructions">
        Choose a fighter on the screen. Use <strong>A/D</strong> to move, <strong>W</strong> to jump,
        <strong>S</strong> to attack, and <strong>E</strong> for your special ability.
    </div>

    <!-- Link to your separate JavaScript file -->
    <script src="game.js"></script>
