<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single-Player JS Smash</title>
    <!-- Include p5.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 4px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: block;
            margin: 0 auto;
        }
        .instructions {
            margin-top: 15px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h1>Single-Player Smash Prototype</h1>
    <div class="instructions">
        <strong>Player (Red):</strong> A/D to Move | W to Jump | S to Attack<br>
        <em>Fight against the CPU (Blue) and knock them off the platforms!</em>
    </div>

    <!-- Link to your separate JavaScript file -->
    <script src="sketch.js"></script>

</body>
</html>
